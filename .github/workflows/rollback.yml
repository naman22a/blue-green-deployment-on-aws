name: Rollback (switch back to previous color)

on:
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
    rollback:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform
        steps:
            - uses: actions/checkout@v4

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.10.5
                  terraform_wrapper: false

            - name: Terraform init
              run: |
                  terraform init -input=false \
                    -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                    -backend-config="key=blue-green-nginx/terraform.tfstate" \
                    -backend-config="region=${{ env.AWS_REGION }}" \
                    -backend-config="use_lockfile=true"

            - name: Flip active color
              run: |
                  ACTIVE=$(terraform output -raw active_color)
                  if [ "$ACTIVE" = "blue" ]; then TARGET=green; else TARGET=blue; fi
                  BLUE_TAG=$(terraform output -raw blue_image_tag)
                  GREEN_TAG=$(terraform output -raw green_image_tag)
                  echo "Rolling back: $ACTIVE -> $TARGET"
                  terraform apply -auto-approve -input=false \
                    -var="active_color=$TARGET" \
                    -var="blue_image_tag=$BLUE_TAG" \
                    -var="green_image_tag=$GREEN_TAG"
                  echo "Rolled back to **$TARGET**" >> "$GITHUB_STEP_SUMMARY"
